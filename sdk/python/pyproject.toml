[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veyrith-client"
version = "0.1.0"
description = "Typed Python client for the Veyrith architecture blueprint API"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
license = { text = "MIT" }

[tool.setuptools]
py-modules = ["veyrith"]
